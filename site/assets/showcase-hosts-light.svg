    <g transform="translate(30 94)"><rect width="200" height="38" rx="12" fill="#EDF3FE"/><text x="12" y="23" fill="#14182A" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">Continue on this phone.</text></g>
