    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4B67B4" stop-opacity=".18"/><stop offset="1" stop-color="#4B67B4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="600" cy="200" r="260" fill="url(#glow)"/>

