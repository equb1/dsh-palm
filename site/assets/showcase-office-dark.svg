      <text x="22" y="72" fill="#EEF1F8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="650">weekly.docx</text>
      <rect x="22" y="86" width="240" height="7" rx="3.5" fill="#2A3552"/>
