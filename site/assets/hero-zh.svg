    <path d="M27 40c0-13 38-13 38 0" fill="none" stroke="#E4EBFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M31 40c5 8 25 8 30 0" fill="none" stroke="#E4EBFF" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M46 55l2.6 7.4L56 65l-7.4 2.6L46 75l-2.6-7.4L36 65l7.4-2.6z" fill="#E4EBFF"/>
