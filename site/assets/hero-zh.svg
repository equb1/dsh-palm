<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">锦囊 · dsh-palm</title>
  <desc id="heroDesc">把 DeepSeek Harness 装进口袋。Android 本机宿主，轻引擎秒开，按需 proot。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232B40"/>
      <stop offset="1" stop-color="#141A29"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E8AE0"/>
      <stop offset="1" stop-color="#4B67B4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4B67B4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4B67B4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8FA2D6" stroke-opacity=".09"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <circle cx="1030" cy="34" r="190" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="735" cy="330" r="150" fill="url(#glow)" opacity=".35" filter="url(#blur)"/>

  <g transform="translate(80 58)">
