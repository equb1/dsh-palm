      <path d="M6.5 8.8c0-3.6 7-3.6 7 0l1 6.2c.3 2.2-1.3 3.6-4.5 3.6s-4.8-1.4-4.5-3.6z" fill="#E4EBFF"/>
      <text x="26" y="14" fill="#E8EDFA" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600">锦囊</text>
