<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Two engines, one protocol</title>
  <desc id="d">An in-process TypeScript light engine for instant replies, and an on-demand proot engine with Ubuntu, Python and Office.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10151F"/><stop offset="1" stop-color="#0B101C"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B67B4"/><stop offset="1" stop-color="#7AAAFF"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8FA2D6" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <g transform="translate(56 44)">
    <rect width="520" height="332" rx="24" fill="#171E2B" stroke="#2A3552"/>
    <rect x="26" y="26" width="92" height="26" rx="13" fill="#4B67B4"/>
    <text x="72" y="44" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600">LIGHT ENGINE</text>
    <text x="26" y="104" fill="#EEF1F8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="750">300ms</text>
    <text x="26" y="128" fill="#7C89A8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">IN-PROCESS · NO WEBSOCKET</text>

    <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#A8B4D2">
      <circle cx="32" cy="154" r="4" fill="#1F9D63"/><text x="44" y="158">Chat, streaming and thinking</text>
      <circle cx="32" cy="180" r="4" fill="#1F9D63"/><text x="44" y="184">Tools, approvals and questions</text>
      <circle cx="32" cy="206" r="4" fill="#1F9D63"/><text x="44" y="210">docx / xlsx + image generation</text>
    </g>

    <g transform="translate(300 88)">
      <rect width="188" height="196" rx="26" fill="#11161F" stroke="#2A3552"/>
      <rect x="12" y="14" width="164" height="18" rx="9" fill="#1A2233"/>
      <rect x="12" y="44" width="112" height="34" rx="10" fill="#1A2A44"/>
      <rect x="12" y="86" width="150" height="46" rx="10" fill="#151B26" stroke="#2A3552"/>
      <rect x="20" y="96" width="110" height="6" rx="3" fill="#2A3552"/>
      <rect x="20" y="108" width="88" height="6" rx="3" fill="#2A3552"/>
      <rect x="20" y="120" width="52" height="7" rx="3.5" fill="#4B67B4" opacity=".7"/>
      <rect x="12" y="142" width="164" height="32" rx="9" fill="#2A2318" stroke="#5D4A28"/>
      <rect x="12" y="182" width="164" height="8" rx="4" fill="#1A2233"/>
    </g>
  </g>

  <g transform="translate(624 44)">
    <rect width="520" height="332" rx="24" fill="#171E2B" stroke="#2A3552"/>
    <rect x="26" y="26" width="92" height="26" rx="13" fill="#2A2318"/>
    <text x="72" y="44" text-anchor="middle" fill="#E2C07E" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600">PROOT ENGINE</text>
    <text x="26" y="100" fill="#EEF1F8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700">Ubuntu 24.04</text>
    <text x="26" y="126" fill="#7C89A8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">PYTHON 3.12 · NODE 24 · ON DEMAND</text>

    <g transform="translate(26 150)">
      <rect width="200" height="140" rx="16" fill="#0A0D14"/>
      <text x="16" y="26" fill="#8B97B5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">$ python3 analyze.py</text>
      <text x="16" y="48" fill="#D7E1FF" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">rows: 1284  ok</text>
      <text x="16" y="70" fill="#7EE787" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">✓ report.xlsx</text>
      <text x="16" y="92" fill="#7EE787" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">✓ summary.pptx</text>
      <text x="16" y="114" fill="#8B97B5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">$ dsh web :8787</text>
      <circle cx="20" cy="126" r="3" fill="#4ADE80"/>
      <text x="28" y="129" fill="#A9BBE4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5">bridge ready</text>
    </g>

    <g transform="translate(248 150)">
      <rect width="244" height="140" rx="16" fill="#11161F" stroke="#2A3552"/>
      <text x="16" y="28" fill="#EEF1F8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600">Office on device</text>
      <rect x="16" y="42" width="212" height="30" rx="8" fill="#151B26" stroke="#2A3552"/>
      <text x="26" y="61" fill="#A8B4D2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">report.xlsx</text>
      <rect x="16" y="80" width="212" height="30" rx="8" fill="#151B26" stroke="#2A3552"/>
      <text x="26" y="99" fill="#A8B4D2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">summary.pptx</text>
      <rect x="16" y="118" width="212" height="8" rx="4" fill="#1A2233"/>
    </g>
  </g>

  <g transform="translate(300 380)">
    <rect width="600" height="24" rx="12" fill="#1B2338" stroke="#2A3552"/>
    <text x="300" y="16" text-anchor="middle" fill="#7C89A8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">ONE PROTOCOL · SAME WORKSPACE · SWITCH ANYTIME</text>
  </g>
</svg>