<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">锦囊技术架构</title>
  <desc id="flowDesc">React Native UI 只认协议：进程内连接轻量 TypeScript 引擎，或通过 WebSocket 桥连接 proot 里的完整 dsh。两种引擎共享工作区。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232B40"/>
      <stop offset="1" stop-color="#141A29"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8FA2D6" stroke-opacity=".08"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7E92C9"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4E5E86"/>
    </marker>
  </defs>

  <rect width="1000" height="480" rx="30" fill="url(#bg)"/>
  <rect width="1000" height="480" rx="30" fill="url(#grid)"/>

  <text x="40" y="54" fill="#FFFFFF" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600">一条协议，两种引擎</text>
  <text x="40" y="80" fill="#93A2C4" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13">会话、审批、工具语义一致；换引擎不影响 UI。</text>

  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
    <rect x="340" y="96" width="320" height="68" rx="16" fill="#1B2336" stroke="#4B67B4" stroke-width="1.5"/>
    <text x="500" y="124" text-anchor="middle" fill="#E8EDFA" font-size="17" font-weight="600">React Native App</text>
    <text x="500" y="146" text-anchor="middle" fill="#8FA2D6" font-size="12">UI · 只认协议</text>

    <path d="M500 164V184M240 184H760M240 184V212M760 184V212" fill="none" stroke="#4E5E86" stroke-width="1.5"/>
    <path d="M240 204V214M760 204V214" fill="none" stroke="#7E92C9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="100" y="218" width="280" height="98" rx="16" fill="#1A2A44" stroke="#4B67B4" stroke-width="1.5"/>
    <text x="122" y="248" fill="#E8EDFA" font-size="16" font-weight="600">LocalEngineClient</text>
    <text x="122" y="270" fill="#A9BBE4" font-size="12">LightHost · TypeScript · 进程内</text>
    <rect x="122" y="282" width="70" height="22" rx="11" fill="#4B67B4" fill-opacity=".24"/>
    <text x="157" y="297" text-anchor="middle" fill="#BFD0FF" font-size="11">默认</text>
    <text x="204" y="297" fill="#7F90B8" font-size="11">秒开 · 无 WebSocket</text>

    <rect x="620" y="218" width="280" height="70" rx="16" fill="#1B2336" stroke="#4B67B4" stroke-width="1.5"/>
    <text x="642" y="246" fill="#E8EDFA" font-size="16" font-weight="600">EngineClient · WS</text>
    <text x="642" y="268" fill="#A9BBE4" font-size="12">单文件桥 :8788</text>

    <path d="M760 288V324" fill="none" stroke="#7E92C9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="620" y="330" width="280" height="80" rx="16" fill="#1B2336" stroke="#4B67B4" stroke-width="1.5"/>
    <text x="642" y="358" fill="#E8EDFA" font-size="16" font-weight="600">proot · dsh web :8787</text>
    <text x="642" y="380" fill="#A9BBE4" font-size="12">Ubuntu 24.04 · Node 24</text>
    <rect x="642" y="390" width="70" height="20" rx="10" fill="#4B67B4" fill-opacity=".24"/>
    <text x="677" y="404" text-anchor="middle" fill="#BFD0FF" font-size="10">按需</text>

    <rect x="100" y="330" width="280" height="80" rx="16" fill="#161D2C" stroke="#33415E"/>
    <text x="122" y="358" fill="#DCE4F7" font-size="15" font-weight="600">HostService · 前台服务</text>
    <text x="122" y="380" fill="#8393B8" font-size="12">Android 生命周期与看门狗</text>
    <text x="122" y="398" fill="#8393B8" font-size="12">启动 proot / Node / 桥</text>

    <path d="M380 370H616" fill="none" stroke="#4E5E86" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrowSoft)"/>

    <rect x="100" y="432" width="800" height="30" rx="15" fill="#1B2336" stroke="#33415E"/>
    <text x="500" y="452" text-anchor="middle" fill="#A9BBE4" font-size="12">共享工作区 &lt;filesDir&gt;/workspace ↔ proot /root/work · 密钥与 ~/.dsh 在 rootfs 外</text>
  </g>
</svg>
